<script>
/* =============== STATE =============== */

let page = "home";
let parsedPending = null;
let parsing = false, coaching = false, aiStatus = "";

const $ = id => document.getElementById(id);
const localISO = d => { const x=d||new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };

const fmtD = iso => { const d=new Date(iso+"T12:00"); return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'}); };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS = {
  gear: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
  eye: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
  eyeOff: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>`,
  star: `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/><path d="M10 11v6M14 11v6"/></svg>`,
  barcode: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10.5 8v8M14 8v8M17 8v8"/></svg>`,
};
// For text embedded inside onclick="fn('...')" attributes: must JS-escape quotes/backslashes
// FIRST, then only HTML-escape &, <, " (never the apostrophe — HTML entity-decoding runs
// before JS parses the handler, so &#39; silently becomes ' again and breaks the string).
const jsAttr = s => String(s??"")
  .replace(/\\/g,"\\\\").replace(/'/g,"\\'")
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const TAGC = {WORK:'var(--amber)',WARMUP:'var(--faint)',LIBRARY:'var(--teal)',EST:'var(--violet)',LABEL:'var(--green)'};

function toast(msg){ const t=$('toast'); t.textContent=msg; t.onclick=null; t.style.cursor=''; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function undoToast(msg, onUndo){
  const t=$('toast'); t.textContent=msg+"  ·  tap to undo"; t.style.cursor='pointer';
  t.onclick=()=>{ t.classList.remove('show'); onUndo(); };
  t.classList.add('show'); setTimeout(()=>{ t.classList.remove('show'); t.onclick=null; },4000);
}

async function load(){
  try{ const r = localStorage.getItem('htlt:data'); if(r){ D = Object.assign(D, JSON.parse(r)); } }
  catch(e){ /* first run — no data yet */ }
}
async function save(){
  try{ localStorage.setItem('htlt:data', JSON.stringify(D)); }
  catch(e){ toast('⚠ Save failed — storage full?'); }
}
function exportData(){
  const blob = new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'htlt-backup-'+todayISO()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(ev){
  const file = ev.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = async ()=>{ try{
    const obj = JSON.parse(rd.result);
    if(!obj || typeof obj!=="object" || !("lifts" in obj)) throw 0;
    D = Object.assign({lifts:[],foods:[],weights:[],library:{},goals:[],settings:{cal:2200,protein:150},coach:null,apiKey:D.apiKey}, obj);
    await save(); toast('✓ Backup restored'); render();
  }catch(e){ toast('⚠ Invalid backup file'); } };
  rd.readAsText(file);
}

/* =============== AI =============== */
async function resolveModel(){
  if(D.model && D.modelCheckedAt && Date.now()-D.modelCheckedAt < 7*864e5) return D.model;
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key="+encodeURIComponent(D.apiKey));
  const data = await res.json();
  if(data.error) throw new Error(data.error.message||"model list failed");
  const models=(data.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
    .map(m=>m.name.replace("models/",""))
    .filter(n=>!/embed|image|tts|audio|live|thinking|exp|research|interaction|robotics|computer|aqa|learnlm|gemma/i.test(n));
  // prefer flash-lite (biggest free-tier quota), then flash, then pro
  const score=n=>{
    const ver=parseFloat((n.match(/(\d+(\.\d+)?)/)||[0])[1])||0;
    let s=ver*10;
    if(/flash-lite/.test(n)) s+=5; else if(/flash/.test(n)) s+=4; else if(/pro/.test(n)) s+=2;
    if(/preview/.test(n)) s-=1;
    return s;
  };
  models.sort((a,b)=>score(b)-score(a));
  if(!models.length) throw new Error("no usable models on this key");
  // verify candidates actually answer, walk down the list
  let lastErr="";
  for(const cand of models.slice(0,6)){
    try{
      const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+cand+":generateContent?key="+encodeURIComponent(D.apiKey),{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text:"Reply with exactly: OK"}]}],generationConfig:{maxOutputTokens:10}})});
      const j=await r.json();
      if(!j.error){ D.model=cand; D.modelCheckedAt=Date.now(); await save(); return cand; }
      lastErr=j.error.message||"";
      // quota-limited model → skip to next candidate rather than fail
    }catch(e){ lastErr=String(e.message||e); }
  }
  throw new Error("no working model found — last error: "+lastErr);
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));
// Transient = worth retrying automatically (server overloaded, brief rate spike, network blip)
function isTransient(msg, status){
  if(status===503 || status===500 || status===429) return true;
  return /high demand|overload|unavailable|try again|temporarily|internal error|timeout|failed to fetch|load failed|network/i.test(String(msg||""));
}
async function geminiOnce(model, prompt, maxTokens){
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+encodeURIComponent(D.apiKey),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],
      generationConfig:{maxOutputTokens:maxTokens}})
  });
  let data=null;
  try{ data = await res.json(); }catch(e){ data=null; }
  if(!res.ok || (data && data.error)){
    const msg = (data && data.error && data.error.message) || ("HTTP "+res.status);
    const err = new Error(msg); err.status = res.status; err.apiMessage = msg;
    throw err;
  }
  const cand = data && data.candidates && data.candidates[0];
  return cand && cand.content && cand.content.parts ? cand.content.parts.map(p=>p.text||"").join("") : "";
}
async function callClaude(prompt, maxTokens=1000, opts={}){
  if(!D.apiKey){ toast('⚠ Add your Gemini API key in Goals → Settings'); throw new Error("no key"); }
  const onRetry = opts.onRetry || (()=>{});
  let model;
  try{ model = await resolveModel(); }
  catch(e){
    // model discovery itself can fail transiently — fall back to a known-good default
    model = D.model || "gemini-flash-lite-latest";
  }
  const backoffs = [700, 1800, 3500];   // ~6s total across 4 attempts
  let lastErr = null;
  for(let attempt=0; attempt<=backoffs.length; attempt++){
    try{
      return await geminiOnce(model, prompt, maxTokens);
    }catch(err){
      lastErr = err;
      const msg = err.apiMessage || err.message || "";
      // model retired / not found -> re-resolve and retry immediately
      if(/no longer available|not found|is not supported/i.test(msg)){
        D.model=null; D.modelCheckedAt=0; await save();
        try{ model = await resolveModel(); continue; }catch(e){ model = "gemini-flash-lite-latest"; continue; }
      }
      // hard daily quota -> not worth retrying
      if(/quota|billing|exceeded your current quota/i.test(msg) && !/rate limit/i.test(msg)){
        D.model=null; D.modelCheckedAt=0; await save();
        throw new Error("Daily free-tier quota reached — try again later.");
      }
      if(attempt < backoffs.length && isTransient(msg, err.status)){
        onRetry(attempt+1, backoffs.length+1);
        await sleep(backoffs[attempt] + Math.random()*300);   // jitter
        // on the last retry, try a different model in case this one is the busy one
        if(attempt === backoffs.length-1){
          try{ D.model=null; D.modelCheckedAt=0; const alt = await resolveModel(); if(alt) model = alt; }catch(e){}
        }
        continue;
      }
      break;
    }
  }
  const finalMsg = (lastErr && (lastErr.apiMessage||lastErr.message)) || "request failed";
  throw new Error(isTransient(finalMsg, lastErr && lastErr.status)
    ? "Google's servers are busy right now. Tried 4 times — give it a minute and tap again."
    : finalMsg);
}

async function parseEntry(){
  const text = $('logtext').value.trim();
  if(!text){ toast('Type something first'); return; }
  parsing = true; aiStatus=""; render();
  const libSummary = Object.entries(D.library).slice(-40).map(([k,v])=>
    `${k}: ${v.cal}cal ${v.p}P ${v.c}C ${v.f}F per "${v.serving}"`).join("\n") || "none yet";
  const prompt = `You are the parser for a personal health log app. The user types free text mixing gym lifts, food, and bodyweight. Parse it into JSON.

USER'S SAVED FOOD LIBRARY (prefer these exact macros when a food matches, tag "LIBRARY"):
${libSummary}

let logTargetDate = null;
function shiftLogDate(n){
  const cur = logTargetDate || todayISO();
  const d = new Date(cur+"T12:00"); d.setDate(d.getDate()+n);
  const iso = localISO(d);
  if(iso > todayISO()) return;
  logTargetDate = iso; render();
}
async function saveParsed(){
  if(!parsedPending) return;
  const date = logTargetDate || todayISO(), ts = Date.now();
  for(const it of parsedPending){
    if(it.type==="lift"){
      D.lifts.push({date, ts, exercise:it.exercise, weightKg:+it.weightKg||0, reps:+it.reps||0, sets:+it.sets||1, warmup:!!it.warmup});
    }else if(it.type==="food"){
      const f = {date, ts, name:it.name, serving:it.serving||"", cal:+it.cal||0, p:+it.p||0, c:+it.c||0, f:+it.f||0, sugar:+it.sugar||0, satFat:+it.satFat||0};
      D.foods.push(f);
      const key = (it.name||"").toLowerCase().trim();
      if(key && !D.library[key]) D.library[key] = {cal:f.cal, p:f.p, c:f.c, f:f.f, sugar:f.sugar, satFat:f.satFat, serving:f.serving};
    }else if(it.type==="weight" && it.kg){
      D.weights.push({date, ts, kg:+it.kg});
    }else if(it.type==="cardio"){
      D.cardio = D.cardio||[];
      D.cardio.push({date, ts, activity:it.activity||"Cardio", minutes:+it.minutes||0, distanceKm:+it.distanceKm||0, calories:+it.calories||0});
    }
  }
  parsedPending = null; $('logtext') && ($('logtext').value="");
  await save(); toast('✓ Saved'); render();
}

function servReplaceAmount(serving, amt){

function attachSwipe(){
  document.querySelectorAll('#app .swipe-el').forEach(el=>{
    const row = el.closest('.swiperow');
    const bgL = row && row.querySelector('.swipe-bg-l');
    const bgR = row && row.querySelector('.swipe-bg-r');
    const kind = el.dataset.swipeKind;
    const idx = el.dataset.swipeIdx!==undefined ? parseInt(el.dataset.swipeIdx,10) : null;
    const key = el.dataset.swipeKey;
    let startX=0, startY=0, dx=0, dragging=false, decided=false, horizontal=false;
    el.addEventListener('touchstart', e=>{
      const t=e.touches[0]; startX=t.clientX; startY=t.clientY; dx=0; dragging=true; decided=false; horizontal=false;
      el.style.transition='none';
      if(bgL) bgL.style.opacity=0; if(bgR) bgR.style.opacity=0;
    }, {passive:true});
    el.addEventListener('touchmove', e=>{
      if(!dragging) return;
      const t=e.touches[0]; dx=t.clientX-startX; const dy=t.clientY-startY;
      if(!decided && (Math.abs(dx)>8||Math.abs(dy)>8)){ decided=true; horizontal=Math.abs(dx)>Math.abs(dy); }
      if(horizontal){
        e.preventDefault();
        const clamped = Math.max(-100,Math.min(100,dx));
        el.style.transform = `translateX(${clamped}px)`;
        const prog = Math.min(1, Math.abs(clamped)/68);
        if(bgL) bgL.style.opacity = clamped>0 ? prog : 0;
        if(bgR) bgR.style.opacity = clamped<0 ? prog : 0;
      }
    }, {passive:false});
    const finish = ()=>{
      if(!dragging) return; dragging=false;
      el.style.transition='transform .2s ease';
      const commit = horizontal && Math.abs(dx)>68;
      if(commit && dx<0){ el.style.transform='translateX(-100%)'; setTimeout(()=>swipeDispatch(kind,'left',idx,key),140); }
      else if(commit && dx>0){ el.style.transform='translateX(0)'; swipeDispatch(kind,'right',idx,key); }
      else { el.style.transform='translateX(0)'; }
      if(bgL) bgL.style.opacity=0; if(bgR) bgR.style.opacity=0;
    };
    el.addEventListener('touchend', finish);
    el.addEventListener('touchcancel', ()=>{
      dragging=false; el.style.transform='translateX(0)';
      if(bgL) bgL.style.opacity=0; if(bgR) bgR.style.opacity=0;
    });
  });
}

  const cal=parseFloat($('ef_cal').value), p=parseFloat($('ef_p').value),
        c=parseFloat($('ef_c').value), fat=parseFloat($('ef_f').value),
        sugar=parseFloat($('ef_sugar').value)||0, satFat=parseFloat($('ef_satfat').value)||0;
  const macrosEdited = Math.round(cal)!==Math.round(f.cal*ratio)||Math.round(p)!==Math.round(f.p*ratio)||Math.round(c)!==Math.round(f.c*ratio)||Math.round(fat)!==Math.round(f.f*ratio);

function todayFoods(){ return D.foods.filter(f=>f.date===todayISO()); }
function dailyCals(days){
  const map={}; const cutoff = Date.now()-days*864e5;
  D.foods.forEach(f=>{ if(f.ts>=cutoff){ map[f.date]=(map[f.date]||0)+f.cal; } });
  const vals=Object.values(map);
  return {avg: vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : 0, n: vals.length};
}
function topExercises(){
  const c={}; D.lifts.forEach(l=>{ if(!l.warmup) c[l.exercise]=(c[l.exercise]||0)+1; });
  return Object.keys(c).sort((a,b)=>c[b]-c[a]);
}
function exHistory(ex){
  const byDate={};
  D.lifts.filter(l=>l.exercise===ex && !l.warmup).forEach(l=>{
    if(!byDate[l.date]) byDate[l.date]={date:l.date, top:0, topReps:0, topSets:0, sets:0, volume:0};
    byDate[l.date].sets += l.sets;
    byDate[l.date].volume += l.weightKg * l.reps * l.sets;
    // track reps/sets that belong to the heaviest set-group of the day (not just any reps)
    if(l.weightKg > byDate[l.date].top || (l.weightKg===byDate[l.date].top && l.reps>byDate[l.date].topReps)){
      byDate[l.date].top = l.weightKg; byDate[l.date].topReps = l.reps; byDate[l.date].topSets = l.sets;
    }
  });
  return Object.values(byDate).sort((a,b)=>a.date<b.date?-1:1);
}

let chartSeq = 0;
function lineChart(points, {w=320,h=120,color="#FFF",unit="",suffix=""}={}){
  if(points.length<2) return `<div style="color:var(--faint);font-size:13px;padding:20px 0;text-align:center">Log ${2-points.length} more ${points.length?'entry':'entries'} to see a trend</div>`;
  const id = 'ch'+(++chartSeq);
  const xs=points.map((_,i)=>i), ys=points.map(p=>p.v);
  const ymin=Math.min(...ys), ymax=Math.max(...ys), pad=(ymax-ymin)*0.15||1;
  const X=i=>10+(w-20)*i/(xs.length-1), Y=v=>h-18-(h-30)*((v-(ymin-pad))/((ymax+pad)-(ymin-pad)));
  const path=points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const dots=points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5" fill="${color}"/>`).join("");
  const labels=points.map((p,i)=> (points.length<=7 || i%Math.ceil(points.length/6)===0 || i===points.length-1) ?
    `<text x="${X(i).toFixed(1)}" y="${h-4}" fill="var(--faint)" font-size="9" text-anchor="middle">${esc(p.l)}</text>`:"").join("");
  // data for the scrub handler: x position, value, label per point
  const scrubData = points.map((p,i)=>({x:+X(i).toFixed(1), y:+Y(p.v).toFixed(1), v:p.v, l:p.l}));
  return `<div class="chartwrap" data-chart-id="${id}" data-chart-suffix="${esc(suffix)}" data-chart-points="${esc(JSON.stringify(scrubData))}" style="position:relative">
    <div class="chart-readout" id="${id}-out" style="opacity:0"></div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;touch-action:pan-y" role="img" aria-label="trend chart">
      <line id="${id}-guide" x1="0" x2="0" y1="6" y2="${h-16}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      <path d="${path}" stroke="${color}" stroke-width="2.5" fill="none" stroke-linecap="round"/>${dots}${labels}
      <circle id="${id}-active" r="5.5" fill="${color}" stroke="#000" stroke-width="2" opacity="0"/>
    </svg>
  </div>`;
}
function attachChartScrub(){
  document.querySelectorAll('#app .chartwrap').forEach(wrap=>{
    const id = wrap.dataset.chartId;
    const suffix = wrap.dataset.chartSuffix||"";
    const dataRaw = wrap.dataset.chartPoints;
    if(!dataRaw) return;
    let pts; try{ pts = JSON.parse(dataRaw); }catch(e){ return; }
    if(!pts || pts.length<2) return;
    const svg = wrap.querySelector('svg');
    const guide = document.getElementById(id+'-guide');
    const active = document.getElementById(id+'-active');
    const out = document.getElementById(id+'-out');
    const vb = svg.getAttribute('viewBox').split(' ').map(Number);
    const vbW = vb[2];
    let scrubbing=false, decided=false, horizontal=false, sx=0, sy=0;
    const showAt = clientX => {
      const rect = svg.getBoundingClientRect();
      if(!rect.width) return;
      const svgX = (clientX - rect.left) / rect.width * vbW;
      let best=0, bestD=Infinity;
      pts.forEach((p,i)=>{ const d=Math.abs(p.x-svgX); if(d<bestD){bestD=d;best=i;} });
      const p = pts[best];
      guide.setAttribute('x1',p.x); guide.setAttribute('x2',p.x); guide.setAttribute('opacity','1');
      active.setAttribute('cx',p.x); active.setAttribute('cy',p.y); active.setAttribute('opacity','1');
      out.textContent = `${p.l} · ${Math.round(p.v*10)/10}${suffix}`;
      out.style.opacity='1';
      // keep readout inside the wrapper horizontally
      out.style.left = Math.max(2, Math.min(88, (p.x/vbW)*100 - 6)) + '%';
    };
    const hide = ()=>{ guide.setAttribute('opacity','0'); active.setAttribute('opacity','0'); out.style.opacity='0'; };
    svg.addEventListener('touchstart', e=>{
      const t=e.touches[0]; sx=t.clientX; sy=t.clientY; scrubbing=true; decided=false; horizontal=false;
    }, {passive:true});
    svg.addEventListener('touchmove', e=>{
      if(!scrubbing) return;
      const t=e.touches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
      if(!decided && (Math.abs(dx)>6||Math.abs(dy)>6)){ decided=true; horizontal=Math.abs(dx)>Math.abs(dy); }
      if(horizontal){ e.preventDefault(); showAt(t.clientX); }
    }, {passive:false});
    svg.addEventListener('touchend', ()=>{ scrubbing=false; setTimeout(hide,1600); });
    svg.addEventListener('touchcancel', ()=>{ scrubbing=false; hide(); });
    // desktop hover support
    svg.addEventListener('mousemove', e=>showAt(e.clientX));
    svg.addEventListener('mouseleave', hide);
  });
}
function barsSets(hist, target=3){
  if(!hist.length) return "";
  const w=320,h=90,bw=Math.min(34,(w-20)/hist.length-8);
  // inset the plot area by half a bar (plus margin) so first/last bars aren't clipped
  const pad = bw/2 + 6;
  const span = w - pad*2;
  const bars=hist.map((p,i)=>{
    const cx = pad + (hist.length>1 ? span*i/(hist.length-1) : span/2);
    const x = cx - bw/2;
    const bh=(h-30)*Math.min(p.sets,target)/target;
    const hit=p.sets>=target;
    return `<rect x="${x.toFixed(1)}" y="${(h-20-bh).toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" rx="6" fill="${hit?'var(--amber)':'#48484A'}"/>
      <text x="${cx.toFixed(1)}" y="${h-6}" fill="var(--faint)" font-size="9" text-anchor="middle">${esc(fmtD(p.date))}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto"><line x1="${pad.toFixed(1)}" x2="${(w-pad).toFixed(1)}" y1="${h-20-(h-30)}" y2="${h-20-(h-30)}" stroke="var(--faint)" stroke-dasharray="4 4" stroke-width="1"/>${bars}</svg>`;
}
function donut(mac){
  const total=mac.reduce((s,m)=>s+m.cal,0)||1;
  let a0=-90; const r=52, cx=70, cy=70;
  const segs=mac.map(m=>{
    const a1=a0+360*m.cal/total;
    const large=(a1-a0)>180?1:0;
    const p0=[cx+r*Math.cos(a0*Math.PI/180),cy+r*Math.sin(a0*Math.PI/180)];
    const p1=[cx+r*Math.cos(a1*Math.PI/180),cy+r*Math.sin(a1*Math.PI/180)];
    const d=`M${p0[0].toFixed(1)},${p0[1].toFixed(1)} A${r},${r} 0 ${large} 1 ${p1[0].toFixed(1)},${p1[1].toFixed(1)}`;
    a0=a1+2;
    return m.cal>0?`<path d="${d}" stroke="${m.color}" stroke-width="20" fill="none" stroke-linecap="round"/>`:"";
  }).join("");
  return `<svg viewBox="0 0 140 140" style="width:140px;height:140px">${segs}</svg>`;
}
function dotMonths(){
  const now=new Date(); const months=[];
  for(let m=2;m>=0;m--){
    const d=new Date(now.getFullYear(),now.getMonth()-m,1);
    const label=d.toLocaleDateString('en-AU',{month:'short'});
    const days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    const active=new Set(sessionDates().filter(s=>{const x=new Date(s+"T12:00");return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear();}).map(s=>+s.slice(8)));
    let dots=""; for(let i=1;i<=35;i++) dots+=`<div class="dot ${i<=days&&active.has(i)?'on':''}"></div>`;
    months.push(`<div style="text-align:center"><div style="font-size:12px;color:var(--dim);margin-bottom:8px">${label}</div><div class="dotgrid">${dots}</div></div>`);
  }
  return `<div style="display:flex;justify-content:space-around">${months.join("")}</div>`;
}

function macroTile(foods, dayLabel){
  const t = foods || todayFoods();
  const label = dayLabel || "today";
  const p=t.reduce((s,f)=>s+f.p,0), c=t.reduce((s,f)=>s+f.c,0), fat=t.reduce((s,f)=>s+f.f,0);
  const sugar=t.reduce((s,f)=>s+(f.sugar||0),0), satFat=t.reduce((s,f)=>s+(f.satFat||0),0);
  const cal=t.reduce((s,f)=>s+f.cal,0);

let progRange = 7;

function calByDay(nDays){
  const out=[];
  for(let i=nDays-1;i>=0;i--){
    const d=daysAgoISO(i);
    out.push({date:d, cal:D.foods.filter(f=>f.date===d).reduce((s,f)=>s+f.cal,0)});
  }
  return out;
}
function weekStartISO(){
  // Monday-start week, local time
  const d = new Date(); const dow = (d.getDay()+6)%7;  // Mon=0 .. Sun=6
  d.setDate(d.getDate()-dow); d.setHours(0,0,0,0);
  return localISO(d);
}
function cardioWeek(){
  const start = weekStartISO();
  const list = (D.cardio||[]).filter(c=>c.date>=start);
  const mins = list.reduce((s,c)=>s+(+c.minutes||0),0);
  const cals = list.reduce((s,c)=>s+(+c.calories||0),0);
  const target = D.settings.cardioMins||90;
  const daysLeft = 7 - ((new Date().getDay()+6)%7) - 1;
  return {mins, cals, sessions:list.length, target,
    pct: target? Math.min(100, Math.round(mins/target*100)) : 0, daysLeft};
}
function logStreak(){
  const dates=new Set([...D.foods.map(f=>f.date),...D.lifts.map(l=>l.date),...D.weights.map(w=>w.date)]);
  let n=0;
  for(let i=0;;i++){
    const d=daysAgoISO(i);
    if(dates.has(d)) n++;
    else if(i===0) continue; // today not logged yet doesn't break streak
    else break;
  }
  return n;
}
function barChart(points,{h=130,target=null}={}){
  if(!points.length) return "";
  const w=320, bw=Math.max(6,Math.min(26,(w-30)/points.length-6));
  const vmax=Math.max(...points.map(p=>p.v), target||0, 1);
  const pad = bw/2 + 8;
  const span = w - pad*2;
  const bars=points.map((p,i)=>{
    const cx = pad + (points.length>1 ? span*i/(points.length-1) : span/2);
    const x = cx - bw/2;
    const bh=(h-34)*p.v/vmax;
    return `<rect x="${x.toFixed(1)}" y="${(h-22-bh).toFixed(1)}" width="${bw}" height="${Math.max(bh,1).toFixed(1)}" rx="4" fill="${p.v?'var(--amber)':'#2A2A2C'}"/>
      ${p.l!==undefined?`<text x="${cx.toFixed(1)}" y="${h-7}" fill="var(--faint)" font-size="8.5" text-anchor="middle">${esc(p.l)}</text>`:""}`;
  }).join("");
  const tline = target?`<line x1="${pad.toFixed(1)}" x2="${(w-pad).toFixed(1)}" y1="${(h-22-(h-34)*target/vmax).toFixed(1)}" y2="${(h-22-(h-34)*target/vmax).toFixed(1)}" stroke="var(--faint)" stroke-dasharray="4 4" stroke-width="1"/>`:"";
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${tline}${bars}</svg>`;
}

function calorieIntakeCard(range, showToggle){
  const n=range;
  const days=calByDay(n);

  const avg=logged.length?logged.reduce((s,d)=>s+d.cal,0)/logged.length:0;
  const prevDays=[]; for(let i=2*n-1;i>=n;i--){const d=daysAgoISO(i);prevDays.push(D.foods.filter(f=>f.date===d).reduce((s,f)=>s+f.cal,0));}
  const prevLogged=prevDays.filter(c=>c>0);
  const prevAvg=prevLogged.length?prevLogged.reduce((a,b)=>a+b,0)/prevLogged.length:0;
  const calDelta=prevAvg?Math.round((avg-prevAvg)/prevAvg*100):null;
  const dayL=d=>"SMTWTFS"[new Date(d+"T12:00").getDay()];
  return `<div class="card">
    ${showToggle?rangeSeg(range,"setHomeRange"):""}

    </div>
    <div class="bignum" style="margin:4px 0 6px">${Math.round(avg).toLocaleString()}<span class="unit"> cal avg</span></div>

function weightTrendCard(range, showToggle){

  const wPrevAvg=wPrev.length?wPrev.reduce((s,x)=>s+x.kg,0)/wPrev.length:0;

const MET = {"incline walk":6.0,"walk":3.5,"run":9.8,"jog":7.0,"cycling":7.5,"bike":7.5,"rowing":7.0,"row":7.0,"swim":8.0,"elliptical":5.0,"stairs":9.0,"hiit":8.5};
function bodyKg(){ const lw=D.weights[D.weights.length-1]; return lw?lw.kg:75; }
// ACSM metabolic equations: VO2 (ml/kg/min) -> kcal.  Walking uses 0.1*S + 1.8*S*G + 3.5,
// running uses 0.2*S + 0.9*S*G + 3.5, where S = m/min and G = fractional grade.
// These respond correctly to BOTH speed and incline, unlike a flat MET lookup.
function estimateBurn(activity, minutes, speedKmh, inclinePct){
  const mins = +minutes||0; if(!mins) return 0;
  const kg = bodyKg();
  const key = String(activity||"").toLowerCase().trim();
  const isFoot = /walk|run|jog|tread|hike|stairs/.test(key);
  const S = (+speedKmh||0) * 1000/60;          // km/h -> m/min
  const G = (+inclinePct||0)/100;              // % -> fraction
  if(isFoot && S>0){
    const running = /run|jog/.test(key) || (+speedKmh) >= 8;
    const vo2 = running ? (0.2*S + 0.9*S*G + 3.5) : (0.1*S + 1.8*S*G + 3.5);
    return Math.round(vo2 * kg / 1000 * 5 * mins);   // ml/kg/min -> L/min -> ~5 kcal/L
  }
  let met = 6.0;
  for(const k in MET){ if(key.includes(k)){ met = MET[k]; break; } }
  if(inclinePct>0 && /walk|tread|hike/.test(key)) met += Math.min(6, inclinePct*0.35);
  return Math.round(met * 3.5 * kg / 200 * mins);
}
function previewBurn(){

  // auto-derive speed from distance+time if speed not given
  const km = parseFloat($('cd_km')?.value)||0;
  const speed = sp || (km&&m ? km/(m/60) : 0);
  if($('cd_cal')) $('cd_cal').value = estimateBurn(a,m,speed,inc);

  if(note) note.textContent = (speed>0 && /walk|run|jog|tread|hike/i.test(a))
    ? `Using speed ${speed.toFixed(1)} km/h${inc?` at ${inc}% incline`:" (flat)"} — ACSM equation.`
    : "Add speed (or distance) for a much better estimate on walks and runs.";
}

  const fatPct = (f.f*9)/f.cal;
  const satFatPct = ((f.satFat||0)*9)/f.cal;
  if(sugarPct>=0.30 || satFatPct>=0.20 || fatPct>=0.55) return {tag:"indulgent", color:"var(--red)", label:"Occasional"};
  if(proteinPct>=0.25 && sugarPct<0.12) return {tag:"good", color:"var(--amber)", label:"Nutrient-dense"};
  return null;
}

let fsQuery="", fsResults=null, fsBusy=false, fsError="", fsPick=null, fsSource="", fsAudit=null;
const OFF_UA = "HTLT/1.0 (personal fitness tracker)";

function offNutriments(n, name, brand, serving, p){
  const num = v => { const x=parseFloat(v); return isFinite(x)?x:0; };
  let kcal = num(n["energy-kcal_100g"]);
  if(!kcal && n["energy_100g"]) kcal = num(n["energy_100g"])/4.184; // kJ -> kcal
  p = p || {};
  // unit: ml for drinks, otherwise grams
  const qtyStr = String(p.quantity||serving||"");
  const unit = /\bml\b|\bmL\b|litre|liter|\bl\b/i.test(qtyStr) ? "ml" : "g";
  const packQty = num(p.product_quantity) || num(qtyStr);          // whole pack, e.g. 375ml can
  const servQty = num(p.serving_quantity) || num(serving);          // stated serving, e.g. 30g
  // A small pack is eaten in one go (can, bottle, bar, pouch); a big pack is not.
  const singleServePack = packQty>0 && packQty<=600;
  const autoAmount = singleServePack ? packQty : (servQty>0 ? servQty : (packQty>0 && packQty<=1000 ? servQty||100 : 100));
  const autoLabel = singleServePack
      ? (qtyStr.trim() ? "1 pack ("+Math.round(packQty)+unit+")" : Math.round(packQty)+unit)
      : (servQty>0 ? (String(serving||"").trim() || Math.round(servQty)+unit) : "100"+unit);
  return {
    name: [brand,name].filter(Boolean).join(" ").trim() || name || "Food",
    per100: true,
    serving: serving || "100g",
    unit,
    packQty: Math.round(packQty)||0,
    servQty: Math.round(servQty)||0,
    autoAmount: Math.round(autoAmount)||100,
    autoLabel,
    cal: Math.round(kcal),
    p: Math.round(num(n["proteins_100g"])*10)/10,
    c: Math.round(num(n["carbohydrates_100g"])*10)/10,
    f: Math.round(num(n["fat_100g"])*10)/10,
    sugar: Math.round(num(n["sugars_100g"])*10)/10,
    satFat: Math.round(num(n["saturated-fat_100g"])*10)/10,
  };
}
// Open Food Facts is crowd-sourced: entries can be blank, or have per-serving figures
// pasted into the per-100g fields. Cross-check calories against the macros (4/4/9).
function auditFood(x){
  const macroCal = x.p*4 + x.c*4 + x.f*9;
  const issues = [];
  if(!x.cal && !macroCal) issues.push("no nutrition data on this entry");
  if(!x.cal && macroCal) issues.push(`calories missing from the entry (macros suggest ~${Math.round(macroCal)} per 100g)`);
  if(!x.p && !x.c && !x.f) issues.push("macros missing from the database entry");
  if(x.cal && macroCal){
    const ratio = macroCal / x.cal;
    if(ratio > 1.25 || ratio < 0.75) issues.push(`calories and macros disagree (macros suggest ~${Math.round(macroCal)} cal per 100g, entry says ${Math.round(x.cal)})`);
  }
  if(x.cal > 950) issues.push("calories per 100g look too high — entry may be per-serving");
  if(x.p>100||x.c>100||x.f>100||x.sugar>100||x.satFat>100) issues.push("a macro exceeds 100g per 100g — entry is wrong");
  if(x.sugar > x.c + 0.5) issues.push("sugar exceeds total carbs");
  if(x.satFat > x.f + 0.5) issues.push("saturated fat exceeds total fat");
  return {ok: issues.length===0, issues, macroCal: Math.round(macroCal)};
}
async function offSearchByName(q){
  // v2 has no full-text; v1 cgi/search.pl does.
  const url = "https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(q)
    +"&search_simple=1&action=process&json=1&page_size=12"
    +"&fields=product_name,brands,nutriments,serving_size,serving_quantity,quantity,product_quantity,code";
  const res = await fetch(url, {headers:{"Accept":"application/json"}});
  if(!res.ok) throw new Error("search HTTP "+res.status);
  const data = await res.json();
  return (data.products||[])
    .filter(p=>p.product_name && p.nutriments && (p.nutriments["energy-kcal_100g"]||p.nutriments["energy_100g"]))
    .map(p=>({...offNutriments(p.nutriments,p.product_name,p.brands,p.serving_size,p), code:p.code}));
}
async function offLookupBarcode(code){
  const url = "https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)
    +".json?fields=product_name,brands,nutriments,serving_size,serving_quantity,quantity,product_quantity";
  const res = await fetch(url, {headers:{"Accept":"application/json"}});
  if(!res.ok) throw new Error("barcode HTTP "+res.status);
  const data = await res.json();
  if(!data || data.status!==1 || !data.product) return null;
  const p = data.product;
  if(!p.nutriments) return null;
  return {...offNutriments(p.nutriments,p.product_name,p.brands,p.serving_size,p), code};
}
async function aiFoodEstimate(q){
  const prompt = `Estimate nutrition for this food as a single JSON object only (no markdown, no commentary):
{"name":"...","cal":<kcal per 100g>,"p":<protein g per 100g>,"c":<carbs g per 100g>,"f":<fat g per 100g>,"sugar":<g per 100g>,"satFat":<g per 100g>,"servingGrams":<typical single serving in grams>,"servingLabel":"<short name for one serving>"}
Food: ${q}
Rules:
- Australian products and preparation where relevant.
- Assume cooked weight, and include the fat/oil it is actually cooked and served with (crumbed and fried foods, sauces, dressings, butter). Restaurant and pub servings are large and generously oiled — do not give a lean home-cooked estimate for those.
- servingGrams must be the realistic weight of ONE typical serving as actually served (e.g. a pub chicken schnitzel plate ~350-450g, a slice of bread ~35g, a medium banana ~120g).
- servingLabel is short, e.g. "1 schnitzel", "1 slice", "1 medium banana", "1 cup".
- Be realistic, not optimistic.`;
  let out = await callClaude(prompt, 400, {onRetry:(n,t)=>{ aiStatus=`Servers busy — retrying (${n}/${t})…`; render(); }});
  out = out.replace(/```json|```/g,"").trim();
  const s=out.indexOf("{"), e=out.lastIndexOf("}");
  if(s===-1||e===-1) throw new Error("no JSON from AI");
  const o = JSON.parse(out.slice(s,e+1));
  return {name:o.name||q, per100:true, serving:"100g", cal:Math.round(+o.cal||0),
    p:+o.p||0, c:+o.c||0, f:+o.f||0, sugar:+o.sugar||0, satFat:+o.satFat||0, estimated:true,
    servingGrams: Math.round(+o.servingGrams||0) || 0,
    servingLabel: (o.servingLabel||"").toString().slice(0,30)};
}
/* Decide what the user meant: a single food to look up, or a session/meal log to parse.
   Food lookup wins only for short, single-line text with no training/quantity signals. */
function looksLikeFoodLookup(text){
  const t = String(text||"").trim();
  if(!t) return false;
  if(/\n/.test(t)) return false;                       // multi-line = a log dump
  if(/[,;]|\band\b|\bwith\b|\bplus\b/i.test(t)) return false;  // multiple items
  // training / bodyweight / cardio signals -> parse, not lookup
  if(/\d+\s*(kg|lb|lbs)\b/i.test(t)) return false;
  if(/\b(reps?|sets?|x\s*\d|\d+\s*x)\b/i.test(t)) return false;
  if(/\b(squat|bench|deadlift|press|curl|row|pulldown|extension|raise|dip|chin|pull[- ]?up|warm ?up)\b/i.test(t)) return false;
  if(/\b(ran|run|walk|jog|cycl|bike|row(ing)?|swim|cardio|min(ute)?s?|km)\b/i.test(t)) return false;
  if(/\b(weighed|bodyweight|weigh[- ]?in)\b/i.test(t)) return false;
  if(/\b\d+\s*(g|grams?|ml|serves?|servings?|scoops?|slices?)\b/i.test(t)) return false; // portion stated -> parse it
  if(/^\d+\s*x?\s+\S/i.test(t)) return false;          // leading count e.g. "3 rice cakes" -> parse it
  return t.split(/\s+/).length <= 5;                   // short phrase = a product name
}

async function runFoodSearch(qOverride){
  const q = (typeof qOverride==="string" && qOverride) ? qOverride.trim() : (($('fs_q')?.value||"").trim());
  if(!q){ toast('Type a food to search'); return; }
  fsQuery=q; fsBusy=true; fsError=""; fsResults=null; fsPick=null; render();
  try{
    const hits = await offSearchByName(q);
    if(hits.length){ fsResults=hits; fsSource="db"; }
    else throw new Error("no database matches");
  }catch(err){
    // fall back to AI estimate
    try{
      const est = await aiFoodEstimate(q);
      fsResults=[est]; fsSource="ai";
    }catch(e2){
      fsError = /no key|Add your Gemini/i.test(String(e2.message))
        ? "No database match, and no API key set for an AI estimate."
        : "Couldn't search the food database or get an AI estimate. Check your connection.";
    }
  }
  fsBusy=false; aiStatus=""; render();
}

}

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span class="label" style="margin:0">Add food</span>${badge}
    </div>
    <div style="font-size:15px;font-weight:600">${esc(fsPick.name)}</div>
    <div style="font-size:11.5px;color:var(--dim);margin:3px 0 10px">Per 100g: ${fsPick.cal} cal · ${fsPick.p}P ${fsPick.c}C ${fsPick.f}F</div>

      <div style="font-size:12px;font-weight:700;color:var(--red);margin-bottom:4px">⚠ This database entry looks wrong</div>

      <div style="font-size:11px;color:var(--faint);margin-top:6px">Open Food Facts is crowd-sourced, so entries can be incomplete or mis-entered. Check the packet and correct the numbers after adding, or fix them below.</div>
      ${fsAudit.macroCal?`<button class="btn btn-ghost" style="margin-top:8px;font-size:12.5px" onclick="useMacroCalories()">Use ${fsAudit.macroCal} cal (calculated from the macros)</button>`:""}
    </div>`:""}
    ${(()=>{ const sg=fsPick.servingGrams||0, sl=fsPick.servingLabel||"1 serving";
      const opts = sg ? [[sg, sl+" ("+sg+"g)"],[Math.round(sg/2), "Half ("+Math.round(sg/2)+"g)"],[100,"100g"]] : [[100,"100g"],[150,"150g"],[200,"200g"]];
      return `<div style="font-size:11px;color:var(--dim);margin-bottom:6px">How much did you have?</div>
      <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
        ${opts.map(([g,label])=>`<button class="btn btn-ghost" style="width:auto;padding:8px 12px;font-size:12.5px;font-weight:600"
          onclick="document.getElementById('fs_amt').value=${g};previewFoodAmount()">${esc(label)}</button>`).join("")}
      </div>`; })()}
    <input id="fs_amt" type="number" inputmode="decimal" value="${fsPick.servingGrams||100}" oninput="previewFoodAmount()">
    <div style="font-size:10.5px;color:var(--faint);margin-top:4px">grams / ml${fsPick.servingGrams?` · one ${esc(fsPick.servingLabel||"serving")} ≈ ${fsPick.servingGrams}g`:""}</div>
    <div id="fs_preview" style="font-size:13px;font-weight:600;color:var(--amber);margin-top:8px">${(()=>{const s=scaledFromPick(fsPick.servingGrams||100);return `${s.cal} cal · ${s.p}P ${s.c}C ${s.f}F`;})()}</div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-g" style="padding:11px 0" onclick="addPickedFood()">✓ Add to ${esc(target)}</button>
      <button class="btn btn-ghost" style="padding:11px 0" onclick="fsPick=null;render()">Back</button>
    </div>
  </div>`;
  if(fsResults) return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:11.5px;color:var(--dim)">${fsResults.length} result${fsResults.length===1?"":"s"} for "${esc(fsQuery)}"</span>${badge}
    </div>
    ${fsResults.map((r,i)=>`<div class="chip" style="cursor:pointer" onclick="pickFoodResult(${i})">
      <div style="flex:1"><div class="t1">${esc(r.name)}</div>
      <div class="t2">per 100g · ${r.cal} cal · ${r.p}P ${r.c}C ${r.f}F</div></div>
      <span style="color:var(--faint)">›</span>
    </div>`).join("")}
    <button class="btn btn-ghost" style="margin-top:8px" onclick="fsResults=null;fsQuery='';render()">Clear</button>
  </div>`;
  return "";
}

/* ============ BARCODE SCANNER ============ */
let scanOpen=false, scanStream=null, scanTimer=null, scanMsg="";
function scanSay(msg){ const el=document.getElementById('scan_msg'); if(el) el.textContent=msg; }
async function openScanner(){
  const wrap=document.getElementById('scanwrap'), v=document.getElementById('scan_video');
  if(!wrap||!v) return;
  wrap.style.display='flex';
  document.getElementById('scan_cancel').onclick=stopScanner;
  const mi=document.getElementById('scan_manual'), mg=document.getElementById('scan_go');
  const submitManual=()=>{ const c=(mi.value||'').replace(/\D/g,''); if(c.length>=8){ mi.value=''; onScanned(c); } else scanSay('Enter at least 8 digits from under the barcode.'); };
  mg.onclick=submitManual;
  mi.onkeydown=e=>{ if(e.key==='Enter') submitManual(); };
  scanOpen=true;
  scanSay('Starting camera…');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    scanSay("This browser can't use the camera. Open the app in Safari over https, then try again.");
    return;
  }
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    v.srcObject = scanStream;
    v.setAttribute('playsinline','');   // iOS: prevents fullscreen takeover
    await v.play().catch(()=>{});
    scanSay('Point at the striped barcode (not a QR code) — fill the frame, hold steady');
    if('BarcodeDetector' in window){
      let det;
      try{ det = new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']}); }
      catch(e){ det = new window.BarcodeDetector(); }
      scanTimer = setInterval(async()=>{
        if(!scanOpen) return;
        try{ const codes = await det.detect(v); if(codes && codes.length) onScanned(codes[0].rawValue); }catch(e){}
      }, 350);
    } else {
      scanSay('Loading scanner…');
      const Z = await loadZXing();
      const Reader = Z.BrowserMultiFormatReader || Z.BrowserBarcodeReader;
      if(!Reader) throw new Error('scanner library missing reader');
      const reader = new Reader();
      scanSay('Point at the striped barcode (not a QR code) — fill the frame, hold steady');
      const cb = (result)=>{ if(result && scanOpen) onScanned(result.getText ? result.getText() : result.text); };
      if(typeof reader.decodeFromStream === 'function' && scanStream){
        await reader.decodeFromStream(scanStream, v, cb);
      } else if(typeof reader.decodeFromVideoElement === 'function'){
        await reader.decodeFromVideoElement(v, cb);
      } else {
        await reader.decodeFromVideoDevice(undefined, v, cb);
      }
      scanTimer = {zxing:reader};
    }
  }catch(e){
    const n=e && e.name;
    scanSay(/scanner library|failed to load/i.test(String((e&&e.message)||'')) ? "Couldn't load the scanner. Type the barcode digits below instead."
      : n==='NotAllowedError' ? 'Camera permission denied. Allow camera access for this site in Safari settings, then try again.'
      : n==='NotFoundError' ? 'No camera found on this device.'
      : 'Camera error: '+String((e&&e.message)||e));
  }
}
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.async=true;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('failed to load '+src));
    document.head.appendChild(s);
  });
}
async function loadZXing(){
  if(window.ZXingBrowser) return window.ZXingBrowser;
  if(window.ZXing && (window.ZXing.BrowserMultiFormatReader||window.ZXing.BrowserBarcodeReader)) return window.ZXing;
  const sources = [
    "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js",
    "https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js",
    "https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js",
  ];
  let lastErr=null;
  for(const src of sources){
    try{
      await loadScript(src);
      const ns = window.ZXingBrowser || window.ZXing;
      if(ns && (ns.BrowserMultiFormatReader||ns.BrowserBarcodeReader)) return ns;
    }catch(e){ lastErr=e; }
  }
  throw lastErr || new Error("couldn't load scanner library");
}
function stopScanner(){
  scanOpen=false;
  if(scanTimer){ if(scanTimer.zxing){ try{scanTimer.zxing.reset();}catch(e){} } else clearInterval(scanTimer); scanTimer=null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  const v=document.getElementById('scan_video'); if(v) v.srcObject=null;
  const wrap=document.getElementById('scanwrap'); if(wrap) wrap.style.display='none';
}
let lastScannedIdx = null;
async function undoScanAdd(){
  if(lastScannedIdx===null) return;
  D.foods.splice(lastScannedIdx,1);
  lastScannedIdx=null;
  await save(); toast('Removed'); render();
}
async function onScanned(code){
  if(!code || !scanOpen) return;
  stopScanner();
  page='log';
  fsBusy=true; fsError=""; fsResults=null; fsPick=null; render();
  try{
    const hit = await offLookupBarcode(code);
    if(hit){
      fsSource="db";
      const audit = auditFood(hit);
      if(!audit.ok){
        // Suspect database entry — show it instead of silently logging bad numbers.
        fsResults=[hit]; fsPick=hit; fsAudit=audit;
        fsBusy=false; aiStatus=""; page='log'; render();
        return;
      }
      fsAudit=null;
      // We know the pack/serving size from the database — log it straight away.
      const grams = hit.autoAmount || 100;
      const k = grams/100;
      const s = {cal:Math.round(hit.cal*k), p:Math.round(hit.p*k*10)/10, c:Math.round(hit.c*k*10)/10,
                 f:Math.round(hit.f*k*10)/10, sugar:Math.round(hit.sugar*k*10)/10, satFat:Math.round(hit.satFat*k*10)/10};
      const date = logTargetDate || todayISO();
      const entry = {date, ts:Date.now(), name:hit.name, serving:hit.autoLabel||(grams+(hit.unit||"g")), ...s};
      D.foods.push(entry);
      const key = hit.name.toLowerCase().trim();
      if(key && !D.library[key]) D.library[key] = {...s, serving:entry.serving};
      lastScannedIdx = D.foods.length-1;
      await save();
      fsBusy=false; aiStatus=""; fsResults=null; fsPick=null;
      page='nutrition'; foodDate = date;
      render();
      undoToast(`✓ ${hit.name} · ${entry.serving} · ${s.cal} cal`, undoScanAdd);
      return;
    }
    else { fsError = `Barcode ${code} isn't in the food database. Try typing the product name instead.`; }
  }catch(e){ fsError = "Lookup failed: "+String(e.message||e); }
  fsBusy=false; aiStatus=""; render();
}

async function quickAddStaple(key){
  const lib = D.library[key];
  if(!lib) return;
  const date = foodDate || todayISO();
  D.foods.push({date, ts:Date.now(), name:key, serving:lib.serving||"", cal:lib.cal||0, p:lib.p||0, c:lib.c||0, f:lib.f||0, sugar:lib.sugar||0, satFat:lib.satFat||0});
  await save(); toast('✓ Added to '+(date===todayISO()?"today":fmtD(date))); render();
}
async function delLib(k){ delete D.library[k]; await save(); render(); }
let lastDeletedLib = null;
async function delLibBySwipe(key){
  const wasFav = (D.favorites||[]).includes(key);
  lastDeletedLib = {key, value: D.library[key], wasFav};
  delete D.library[key];
  if(D.favorites) D.favorites = D.favorites.filter(k=>k!==key);
  await save();
  undoToast('Removed from history', undoDeleteLib);
  render();
}
async function undoDeleteLib(){
  if(!lastDeletedLib) return;
  D.library[lastDeletedLib.key] = lastDeletedLib.value;
  if(lastDeletedLib.wasFav){ D.favorites = D.favorites||[]; if(!D.favorites.includes(lastDeletedLib.key)) D.favorites.push(lastDeletedLib.key); }
  lastDeletedLib = null;
  await save(); render();
}
